.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.bad{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn[data-armed]{background:var(--bad);color:#fff;border-color:var(--bad)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:14px}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.form .full{grid-column:1/-1}
.form h3{grid-column:1/-1;font-size:15px;padding-top:6px;border-top:1px solid var(--line)}
.checks{display:flex;gap:6px 14px;flex-wrap:wrap}

const loc=()=>L()==='ar'?'ar-u-nu-latn':'en-GB';

let DB=null,DBNAME='my-daily-planner-local';window.setDbName=n=>{DBNAME=n};
function idbOpen(){return new Promise((res,rej)=>{try{const r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function idbGet(k){return new Promise((res,rej)=>{const q=DB.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function idbPut(k,v){return new Promise((res,rej)=>{const tx=DB.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function load(){
  try{DB=await idbOpen();
    for(const k of['appts','tasks','follows']){const v=await idbGet(k);if(Array.isArray(v))S[k]=v}
    const m=await idbGet('meta');if(m)Object.assign(S.meta,m);
    if(!await idbGet('seeded')&&!window.SKIP_SEED){await seed();await idbPut('seeded',1)}
  }catch(e){UI.persisted=false;if(!S.appts.length)await seed()}
}
async function save(k){if(DB){try{await idbPut(k,S[k])}catch(e){UI.persisted=false}}if(window.onLocalSave)window.onLocalSave(k)}
const saveAll=()=>Promise.all(['appts','tasks','follows','meta'].map(save));

/* ---------- reminders ---------- */
function remTimes(a){
  if(a.status==='done'||a.status==='cancelled')return[];
  const out=[];const base=ts(a.date,a.start||'09:00');
  for(const o of (a.rem&&a.rem.offs)||[]){const at=base-o*60000;out.push({key:a.id+'|'+at,at,a,off:o})}
  if(a.rem&&a.rem.custom){const at=new Date(a.rem.custom).getTime();if(!isNaN(at))out.push({key:a.id+'|'+at,at,a,off:-1})}
  return out;
}
function dueReminders(){
  const now=Date.now(),res=[];
  for(const a of S.appts)for(const r of remTimes(a)){
    if(r.at>now||r.at<now-48*3600e3)continue;
    if(S.meta.fired[r.key])continue;
    if((S.meta.snooze[r.key]||0)>now)continue;
    res.push(r);
  }
  return res.sort((x,y)=>x.at-y.at);
}
function beep(){try{const C=window.AudioContext||window.webkitAudioContext;const c=new C();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.06;o.start();setTimeout(()=>{o.stop();c.close()},220)}catch(e){}}
function notify(title,body){
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  beep();toast(title);
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration){
      navigator.serviceWorker.getRegistration().then(r=>{if(r)r.showNotification(title,{body,tag:title+body,vibrate:[200,100,200]});else new Notification(title,{body})}).catch(()=>{try{new Notification(title,{body})}catch(e){}});
    }else new Notification(title,{body});
  }catch(e){}
}
let lastDueCount=-1;
function checkReminders(){if(window.COMM_ONLY)return;
  const now=Date.now();let changed=false;
  for(const r of dueReminders()){
    if(!S.meta.notified[r.key]&&now-r.at<5*60000){
      S.meta.notified[r.key]=1;changed=true;
      notify(r.a.title,(r.off>0?(t('r_'+r.off)||''):t('r_0'))+' · '+r.a.start);
    }
  }
  if(changed)save('meta');
  const c=dueReminders().length;
  if(c!==lastDueCount){lastDueCount=c;if(UI.view==='dash'&&!$('#modal').classList.contains('on'))render()}
}

function saveAppt(id){
  const err=m=>{const e=$('#a-err');e.textContent=m;e.hidden=false;return};

  const mapItems=(txt,prev)=>lines(txt).map(l=>{const[a,...r]=l.split('|');const text=a.trim(),owner=r.join('|').trim();const m=(prev||[]).find(p=>p.text===text);return m?Object.assign({},m,{owner}):{id:uid(),text,owner,taskId:''}});
  const offs=[...document.querySelectorAll('.a-off:checked')].map(e=>Number(e.value));

function nextDue(x){return x.repeat==='daily'?addDays(x.due||today(),1):addDays(x.due||today(),7)}
function setTaskDone(x,done){
  if(done){x.status='done';x.doneOn=today();(x.subtasks||[]).forEach(s=>s.done=true);
    if(x.repeat&&x.repeat!=='none'){S.tasks.push(Object.assign({},x,{id:uid(),status:'notstarted',doneOn:'',due:nextDue(x),createdAt:nowISO(),subtasks:(x.subtasks||[]).map(s=>({t:s.t,done:false}))}))}
  }else{x.status='inprogress';x.doneOn=''}
}
function saveTask(id){
  const title=val('k-title');const err=m=>{const e=$('#a-err');e.textContent=m;e.hidden=false};
  if(!title)return err(t('titleErr'));
  const old=id?taskById(id):null;
  const subs=lines(val('k-subs')).map(s=>{const m=old&&(old.subtasks||[]).find(o=>o.t===s);return{t:s,done:m?m.done:false}});
  const f={title,prio:val('k-prio'),due:val('k-due'),minutes:val('k-min'),repeat:val('k-rep'),apptId:val('k-appt'),subtasks:subs,notes:val('k-notes'),delayReason:val('k-delay')};
  const st=val('k-status');
  if(old){Object.assign(old,f);if(st==='done'&&old.status!=='done')setTaskDone(old,true);else if(st!=='done'){old.status=st;if(old.doneOn)old.doneOn=''}}
  else{const n=Object.assign({id:uid(),status:'notstarted',doneOn:'',createdAt:nowISO()},f,UI.pre||{});UI.pre=null;S.tasks.push(n);if(st==='done')setTaskDone(n,true);else n.status=st;
    if(n.itemRef){const a=apptById(n.itemRef.appt);const it=a&&(a[n.itemRef.list]||[]).find(z=>z.id===n.itemRef.item);if(it){it.taskId=n.id;save('appts')}delete n.itemRef}}
  const back=UI.after;save('tasks');closeModal();toast(t('saved'));render();if(back)apptDetail(back);
}

/* ---------- reports ---------- */
function reportData(from,to){
  const ap=sortAppts(S.appts.filter(a=>a.date>=from&&a.date<=to));
  const c=s=>ap.filter(a=>a.status===s||(s==='upcoming'&&a.status==='ongoing')).length;
  const done=S.tasks.filter(x=>x.status==='done'&&x.doneOn&&x.doneOn>=from&&x.doneOn<=to);
  const rate=taskRate(from,to);
  const fdone=S.follows.filter(f=>f.status==='done'&&f.doneOn>=from&&f.doneOn<=to);
  const fprog=S.follows.filter(f=>(f.log||[]).some(l=>l.at.slice(0,10)>=from&&l.at.slice(0,10)<=to)&&f.status!=='done');
  const lateT=S.tasks.filter(x=>x.status!=='done'&&x.due&&x.due>=from&&x.due<=to&&x.due<today());
  const openActs=[];ap.forEach(a=>(a.actions||[]).forEach(x=>{if(!actionDone(x))openActs.push({a,x})}));
  const needFollow=ap.filter(a=>a.status==='postponed'||(a.actions||[]).some(x=>!actionDone(x)));
  const decisions=ap.filter(a=>a.decisions);
  return{ap,n:ap.length,done:c('done'),post:c('postponed'),canc:c('cancelled'),up:c('upcoming'),doneT:done,rate,fdone,fprog,lateT,openActs,needFollow,decisions};
}
function autoSummary(r){
  if(!r.n&&!r.rate.d&&!r.doneT.length)return t('sumNoData');
  const parts=[];
  if(r.n)parts.push(TX[L()].sumMeet(r.n,r.done,r.post,r.canc));
  if(r.rate.d||r.doneT.length)parts.push(TX[L()].sumTasks(r.rate.n,r.rate.d,r.rate.p));
  if(r.fdone.length)parts.push((L()==='ar'?'اكتملت ':'Completed follow-ups: ')+r.fdone.length+(L()==='ar'?' متابعة.':'.'));
  return parts.join(' ');
}
function suggestions(r){
  const out=[];
  r.lateT.sort((a,b)=>PR[a.prio]-PR[b.prio]).slice(0,3).forEach(x=>out.push((L()==='ar'?'إنجاز المهمة المتأخرة: ':'Finish overdue task: ')+x.title));
  S.follows.filter(f=>f.status==='action'||f.status==='waiting').slice(0,2).forEach(f=>out.push((L()==='ar'?'متابعة: ':'Follow up: ')+f.title));
  r.openActs.slice(0,3).forEach(o=>out.push((L()==='ar'?'تنفيذ إجراء من اجتماع: ':'Action from meeting: ')+o.x.text));
  return out;
}

function csvFor(from,to){
  const r=reportData(from,to);const rows=[['type','date','title','kind','status','details']];
  r.ap.forEach(a=>rows.push(['meeting',a.date,a.title,typeName(a),t('s_'+a.status),[a.goal,a.decisions,a.outcome].filter(Boolean).join(' / ')]));
  r.doneT.forEach(x=>rows.push(['task_done',x.doneOn,x.title,'',t('k_done'),'']));
  r.lateT.forEach(x=>rows.push(['task_late',x.due,x.title,'',t('k_'+x.status),x.delayReason||'']));
  r.fdone.forEach(f=>rows.push(['follow_done',f.doneOn,f.title,'',t('f_done'),'']));
  r.openActs.forEach(o=>rows.push(['open_action',o.a.date,o.x.text,o.a.title,'',o.x.owner||'']));
  return '﻿'+rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
}

 close(){closeModal()},
 go(el){UI.view=el.dataset.v;ACT['menu-close']();render();window.scrollTo(0,0)},
 'menu'(){const o=!$('#side').classList.contains('open');$('#side').classList.toggle('open',o);$('#scrim').classList.toggle('open',o)},
 'menu-close'(){$('#side').classList.remove('open');$('#scrim').classList.remove('open')},
 new(){newChooser()},
 'new-appt'(){apptForm({date:UI.view==='cal'?UI.cal.sel:today()})},
 'new-appt-on'(el){apptForm({date:el.dataset.d})},
 'new-task'(){UI.after=null;taskForm({})},
 'new-follow'(){followForm({})},
 'open-appt'(el){apptDetail(el.dataset.id)},
 'edit-appt'(el){apptForm(apptById(el.dataset.id))},
 'save-appt'(el){saveAppt(el.dataset.id)},
 'del-appt'(el){S.appts=S.appts.filter(a=>a.id!==el.dataset.id);S.tasks.forEach(x=>{if(x.apptId===el.dataset.id)x.apptId=''});save('appts');save('tasks');closeModal();toast(t('deleted'));render()},
 'done-appt'(el){const a=apptById(el.dataset.id);a.status='done';a.updatedAt=nowISO();(a.history=a.history||[]).push({at:nowISO(),text:t('s_done')});save('appts');apptDetail(a.id);render()},
 postpone(el){reschedForm(apptById(el.dataset.id),true)},
 reschedule(el){reschedForm(apptById(el.dataset.id),false)},
 'save-resched'(el){const a=apptById(el.dataset.id);const d=val('r-date');if(!d)return;
   a.date=d;a.start=val('r-start');a.end=val('r-end');if(el.dataset.p==='1')a.status='postponed';else if(a.status==='postponed')a.status='upcoming';
   a.updatedAt=nowISO();(a.history=a.history||[]).push({at:nowISO(),text:(el.dataset.p==='1'?t('postpone'):t('reschedule'))+' → '+d});
   Object.keys(S.meta.fired).forEach(k=>{if(k.startsWith(a.id+'|'))delete S.meta.fired[k]});save('meta');save('appts');render();apptDetail(a.id)},
 'item2task'(el){const a=apptById(el.dataset.id);const it=(a[el.dataset.list]||[]).find(z=>z.id===el.dataset.item);
   UI.after=a.id;UI.pre={itemRef:{appt:a.id,list:el.dataset.list,item:it.id},apptId:a.id};taskForm({title:it.text,due:a.date,apptId:a.id,prio:a.prio})},
 'edit-task'(el){UI.after=null;taskForm(taskById(el.dataset.id))},
 'save-task'(el){saveTask(el.dataset.id)},
 'del-task'(el){S.tasks=S.tasks.filter(x=>x.id!==el.dataset.id);S.appts.forEach(a=>(a.actions||[]).concat(a.topics||[]).forEach(i=>{if(i.taskId===el.dataset.id)i.taskId=''}));save('tasks');save('appts');toast(t('deleted'));render()},
 'toggle-task'(el){const x=taskById(el.dataset.id);setTaskDone(x,el.checked);save('tasks');render()},
 'toggle-sub'(el){const x=taskById(el.dataset.id);x.subtasks[+el.dataset.i].done=el.checked;if(x.status==='notstarted')x.status='inprogress';if(x.subtasks.length&&x.subtasks.every(s=>s.done))setTaskDone(x,true);save('tasks');render()},
 'task-plus1'(el){const x=taskById(el.dataset.id);x.due=addDays(x.due>today()?x.due:today(),1);save('tasks');render()},
 'tk-tab'(el){UI.tk.tab=el.dataset.tab;render()},
 'edit-follow'(el){followForm(S.follows.find(f=>f.id===el.dataset.id))},
 'save-follow'(el){saveFollow(el.dataset.id)},
 'del-follow'(el){S.follows=S.follows.filter(f=>f.id!==el.dataset.id);save('follows');toast(t('deleted'));render()},
 'follow-pin'(el){const f=S.follows.find(x=>x.id===el.dataset.id);f.pinned=!f.pinned;save('follows');render()},
 'follow-plus1'(el){const f=S.follows.find(x=>x.id===el.dataset.id);f.next=addDays(today(),1);f.lastUpdate=nowISO();(f.log=f.log||[]).push({at:nowISO(),text:t('plus1'),progress:f.progress});save('follows');render()},
 'follow-update'(el){followUpdateForm(S.follows.find(f=>f.id===el.dataset.id))},
 'save-update'(el){const f=S.follows.find(x=>x.id===el.dataset.id);const st=val('u-status');const p=st==='done'?100:parseInt(val('u-prog'))||0;
   f.progress=p;f.status=st;f.next=val('u-next');f.nextStep=val('u-step');f.lastUpdate=nowISO();f.doneOn=st==='done'?(f.doneOn||today()):'';
   (f.log=f.log||[]).push({at:nowISO(),text:val('u-text')||t('addUpdate'),progress:p});
   if(st==='done'&&f.repeat&&f.repeat!=='none'){f.status='notstarted';f.progress=0;f.next=addDays(today(),f.repeat==='daily'?1:f.repeat==='weekly'?7:(f.repeatN||3));f.doneOn=today()}
   save('follows');closeModal();toast(t('saved'));render()},
 'rem-snooze'(el){const k=el.dataset.key;S.meta.snooze[k]=Date.now()+10*60000;delete S.meta.notified[k];save('meta');lastDueCount=-1;render()},
 'rem-done'(el){S.meta.fired[el.dataset.key]=1;save('meta');lastDueCount=-1;render()},
 'cal-prev'(){const c=UI.cal;c.date=c.mode==='month'?addMonths(c.date,-1):addDays(c.date,c.mode==='week'?-7:-1);if(c.mode==='day')c.sel=c.date;render()},
 'cal-next'(){const c=UI.cal;c.date=c.mode==='month'?addMonths(c.date,1):addDays(c.date,c.mode==='week'?7:1);if(c.mode==='day')c.sel=c.date;render()},
 'cal-today'(){UI.cal.date=today();UI.cal.sel=today();render()},
 'cal-mode'(el){UI.cal.mode=el.dataset.m;render()},
 'cal-sel'(el){UI.cal.sel=el.dataset.d;render()},
 'rp-quick'(el){const q=el.dataset.q,d=today();const R=rpRange();
   if(q==='rQuick'){R.from=d;R.to=d}else if(q==='rWeek'){R.from=weekStart(d);R.to=addDays(R.from,6)}
   else if(q==='rMonth'){const x=pd(d);R.from=dstr(new Date(x.getFullYear(),x.getMonth(),1));R.to=dstr(new Date(x.getFullYear(),x.getMonth()+1,0))}
   else{const y=pd(d).getFullYear();R.from=y+'-01-01';R.to=y+'-12-31'}render()},
 'rp-approve'(){const R=rpRange(),k=R.from+'|'+R.to;const cur=S.meta.reportEdits[k]||{};saveReportEdit(!cur.approved);render()},
 'rp-copy'(){const R=rpRange();copyText(csvFor(R.from,R.to).replace('﻿',''))},
 'rp-csv'(){const R=rpRange();download('report-'+R.from+'_'+R.to+'.csv',csvFor(R.from,R.to),'text/csv;charset=utf-8')},
 'rp-print'(){saveReportEdit();try{window.print()}catch(e){}},
 'rp-word'(){saveReportEdit();const R=rpRange();const c=$('#view .rep').cloneNode(true);
   c.querySelectorAll('.noprint,button').forEach(n=>n.remove());
   c.querySelectorAll('textarea').forEach(n=>{const d=document.createElement('p');d.textContent=n.value;n.replaceWith(d)});
   c.querySelectorAll('label').forEach(n=>{n.style.display='block'});
   const dir=L()==='ar'?'rtl':'ltr';
   const css='body{font-family:Arial,Tahoma,sans-serif;direction:'+dir+'}table{border-collapse:collapse;width:100%}th,td{border:1px solid #999;padding:4px 6px;text-align:start}h1{color:#12304d}h3{color:#0b6f7a}.stat{display:inline-block;margin:4px 16px 4px 0}.stat b{font-size:18pt}.stat span{display:block;font-size:9pt;color:#555}.grid{display:block}';
   const html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>'+esc(t('reports'))+'</title><style>'+css+'</style></head><body dir="'+dir+'"><h1>'+esc(t('reports'))+'</h1><p>'+esc(fmtD(R.from))+' – '+esc(fmtD(R.to))+'</p>'+c.innerHTML+'</body></html>';
   download('report-'+R.from+'_'+R.to+'.doc','\ufeff'+html,'application/msword')},
 'set-lang'(el){S.meta.lang=el.dataset.l;try{localStorage.setItem('planner_lang',S.meta.lang)}catch(e){}save('meta');render()},
 'set-theme'(el){S.meta.theme=el.dataset.m;save('meta');render()},
 'notif-allow'(){if(!('Notification' in window)){toast('Notifications not supported');return}Notification.requestPermission().then(()=>render()).catch(()=>{})},
 'notif-test'(){notify(t('app'),t('test'))},
 'export-json'(){const j=JSON.stringify({appts:S.appts,tasks:S.tasks,follows:S.follows,meta:S.meta},null,1);if(IN_ARTIFACT)copyText(j);else download('my-daily-planner-backup.json',j,'application/json')},
 'wipe'(){S.appts=[];S.tasks=[];S.follows=[];S.meta.fired={};S.meta.notified={};S.meta.snooze={};S.meta.reportEdits={};saveAll();toast(t('deleted'));render()}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){if(e.target.id==='modal')closeModal();return}
  if(el.tagName==='INPUT'&&el.type==='checkbox')return; /* handled on change */
  if(el.dataset.confirm&&!el.dataset.armed){el.dataset.armed='1';el.dataset.orig=el.textContent;el.textContent=t('delOk');e.stopPropagation();return}
  const fn=ACT[el.dataset.act]||(window.EXTRA_ACT||{})[el.dataset.act];if(fn){e.preventDefault();fn(el,e)}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.matches('input[type=checkbox][data-act]')){const fn=ACT[el.dataset.act];if(fn)fn(el,e);return}
  if(el.dataset.f!=null){UI.af[el.dataset.f]=el.value;render();return}
  if(el.dataset.tk){UI.tk[el.dataset.tk]=el.value;render();return}
  if(el.dataset.rp){const R=rpRange();if(el.dataset.rp==='cmp')R.cmp=el.checked;else if(el.value){R[el.dataset.rp]=el.value;if(R.to<R.from)R.to=R.from}render();return}
  if(el.id==='imp'&&el.files[0]){const fr=new FileReader();fr.onload=()=>{try{const j=JSON.parse(fr.result);['appts','tasks','follows'].forEach(k=>{if(Array.isArray(j[k]))S[k]=j[k]});if(j.meta)Object.assign(S.meta,j.meta);saveAll();toast(t('imported'));render()}catch(err){toast('JSON error')}};fr.readAsText(el.files[0])}
});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.f==='q'){UI.af.q=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();ACT['menu-close']()}});

/* ---------- boot ---------- */
(async function(){
  if(window.authInit)await window.authInit();
  await load();
  render();
  if(window.syncStart)window.syncStart();
  checkReminders();
  setInterval(checkReminders,20000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReminders()});
})();
</script>
