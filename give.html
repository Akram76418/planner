<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12304d"><meta name="robots" content="noindex">
<title>التكافل | المساهمة</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f7fa;--card:#fff;--tx:#14263a;--sub:#5d6f82;--ac:#0b6f8a;--ok:#12805c;--bad:#b3261e;--bd:#dbe3ea}
@media(prefers-color-scheme:dark){:root{--bg:#0e1822;--card:#16232f;--tx:#e8eef4;--sub:#9db0c1;--ac:#4cc3dc;--ok:#4cd6a4;--bad:#ff8a80;--bd:#27394a}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 system-ui,"Segoe UI",Tahoma,sans-serif}
header{background:#12304d;color:#fff;padding:14px 16px;text-align:center}header h1{margin:0;font-size:20px}
main{max-width:560px;margin:0 auto;padding:14px 16px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
label{display:block;font-size:14px;color:var(--sub);margin:10px 0 2px}
select,input,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;padding:12px 16px;border-radius:10px;border:1px solid var(--ac);background:var(--ac);color:#fff;cursor:pointer;margin-top:14px;width:100%}button:disabled{opacity:.5}
.sub{color:var(--sub);font-size:14px}.pay{white-space:pre-wrap;background:var(--bg);border:1px dashed var(--ac);border-radius:10px;padding:12px;margin:8px 0;direction:auto;font-weight:600}
.msg{padding:10px 12px;border-radius:10px;margin:10px 0}.err{background:rgba(179,38,30,.12);color:var(--bad)}.good{background:rgba(18,128,92,.12);color:var(--ok)}
.hp{position:absolute;inset-inline-start:-9999px;width:1px;height:1px;overflow:hidden}
.ref{font-size:22px;font-weight:700;text-align:center;direction:ltr}
</style></head><body>
<header><h1>🤝 التكافل</h1></header>
<main id="app"><div class="card">جارٍ التحميل…</div></main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
'use strict';
var C=window.PLANNER_CONFIG,sb=null,S={info:null,done:null,msg:'',bad:false,busy:false,t0:Date.now()};
var ERR={closed:'باب المساهمة مغلق حالياً.',amount:'أدخل مبلغاً صحيحاً (من 1 إلى 100000).',rate:'أرسلت عدة مرات خلال وقت قصير. حاول لاحقاً بعد ساعة.',busy:'الصفحة مشغولة حالياً، حاول بعد قليل.'};
function h(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(i){return document.getElementById(i)}
var CUR={ILS:'₪',USD:'$',JOD:'د.أ',EUR:'€'};
async function init(){
  if(!window.supabase||!C){$('app').innerHTML='<div class="card">تعذّر تحميل الصفحة. تحقق من الاتصال.</div>';return}
  sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
  try{var r=await sb.rpc('tk_pub_info');if(r.error)throw r.error;S.info=r.data}catch(e){S.info=null;S.msg='تعذّر الاتصال، حاول لاحقاً.';S.bad=true}
  draw();
}
function draw(){
  var el=$('app'),i=S.info,html='';
  if(!i){el.innerHTML=S.msg?'<div class="msg err">'+h(S.msg)+'</div>':'';return}
  if(S.done){
    html+='<div class="card"><b>جزاك الله خيراً 🤲</b><p>شكراً لمساهمتك. سُجّل تعهّدك بمبلغ <b>'+h(S.done.amt)+' '+h(S.done.cur)+'</b>، وسيُعتمد بعد وصول المبلغ إلى الجهة المسؤولة.</p>'+
      (S.done.ref?'<div class="sub">رقم مرجع تعهّدك (اذكره مع التحويل):</div><div class="ref">#'+h(S.done.ref)+'</div>':'')+
      (i.pay_info?'<p><b>بيانات التحويل:</b></p><div class="pay">'+h(i.pay_info)+'</div>':'')+'</div>';
    el.innerHTML=html;return
  }
  if(!i.rounds.length){el.innerHTML='<div class="card">باب المساهمة غير مفتوح حالياً. شكراً لاهتمامك.</div>';return}
  html+='<div id="mg"></div><div class="card"><b>ساهم في التكافل</b><p class="sub">اكتب المبلغ الذي تود التبرع به، وسيظهر لك بعدها رقم الحساب وطريقة التحويل. لا يُحتسب تعهّدك إلا بعد وصول المبلغ واعتماده من الإدارة.</p>'+
    (i.rounds.length>1?'<label>الدورة</label><select id="rd">'+i.rounds.map(function(r){return'<option value="'+r.id+'">'+h(r.title)+'</option>'}).join('')+'</select>':'<input type="hidden" id="rd" value="'+i.rounds[0].id+'">')+
    '<label>الاسم (اختياري)</label><input id="nm" maxlength="80" autocomplete="name" placeholder="يمكنك ترك الاسم فارغاً">'+
    '<label>المبلغ ('+h(CUR[i.rounds[0].currency]||'')+') *</label><input id="am" type="number" min="1" max="100000" step="0.01" inputmode="decimal">'+
    '<label>النوع</label><select id="kd"><option value="donation">تبرع</option><option value="course">رسوم دورة تدريبية</option></select>'+
    '<label>ملاحظة (اختياري)</label><input id="nt" maxlength="200">'+
    '<div class="hp" aria-hidden="true"><label>لا تملأ هذا الحقل</label><input id="hp" tabindex="-1" autocomplete="off"></div>'+
    '<button id="go"'+(S.busy?' disabled':'')+'>تعهّد بالمساهمة</button></div>';
  el.innerHTML=html;
  $('go').onclick=send;
}
function note(m){S.msg=m;S.bad=true;var e=$('mg');if(e)e.innerHTML=m?'<div class="msg err">'+h(m)+'</div>':'';else draw()}
async function send(){
  var rid=Number($('rd').value),am=Number($('am').value),r0=S.info.rounds.filter(function(r){return r.id===rid})[0]||S.info.rounds[0];
  if(!(am>=1&&am<=100000)){note(ERR.amount);return}
  if(Date.now()-S.t0<2500){note('لحظة من فضلك ثم أعد المحاولة.');return}   // الروبوتات ترسل فوراً
  var args={p_round:rid,p_name:$('nm').value,p_amount:am,p_kind:$('kd').value,p_note:$('nt').value,p_hp:$('hp').value};
  S.busy=true;$('go').disabled=true;
  try{var r=await sb.rpc('tk_pub_pledge',args);if(r.error)throw r.error;var d=r.data||{};
    if(!d.ok){note(ERR[d.err]||'حدث خطأ.')}
    else{S.done={amt:am,cur:CUR[r0.currency]||r0.currency,ref:d.ref};note('');draw();return}
  }catch(e){note('تعذّر الإرسال، تحقق من الاتصال وأعد المحاولة.')}
  S.busy=false;var g=$('go');if(g)g.disabled=false;
}
init();
</script></body></html>
